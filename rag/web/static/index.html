<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaterialRAG · 材料文献检索与数据抽取</title>
<style>
  :root{
    color-scheme: only light;
    --meta:#8aa0b8; --comp:#4a9d7f; --proc:#e08a3c; --prop:#8b6fbd; --emph:#3b73b9;
    --line:#c9c9c9; --line2:#e3e3e3; --bg:#ffffff; --soft:#f6f7f8;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);color:#000;}
  body{
    margin:0; font-family:"Times New Roman","SimHei",serif; font-size:14px; line-height:1.65;
  }
  code,pre,.mono,input[type=text],textarea{
    font-family:Consolas,"Courier New",monospace; font-size:12.5px;
  }
  header{border-bottom:2px solid #000; padding:10px 18px;}
  header h1{margin:0; font-size:17px; letter-spacing:.5px;}
  header .sub{color:#000; font-size:12px; margin-top:2px;}
  nav{border-bottom:1px solid var(--line); padding:0 18px; display:flex; gap:0;}
  nav button{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:8px 16px; font-family:inherit; font-size:13.5px; color:#000; cursor:pointer;
  }
  nav button.on{border-bottom-color:#000; font-weight:bold;}
  main{padding:16px 18px 60px; max-width:1180px;}
  section{display:none;} section.on{display:block;}
  h2{font-size:14px; margin:18px 0 6px; border-left:3px solid #000; padding-left:7px;}
  fieldset{border:1px solid var(--line); padding:12px; margin:0 0 14px;}
  legend{font-size:12.5px; padding:0 5px;}
  label{display:inline-block; min-width:96px; font-size:13px;}
  input[type=text],textarea,select{
    border:1px solid var(--line); background:#fff; color:#000;
    padding:5px 7px; font-family:inherit; font-size:13px;
  }
  input[type=text]{min-width:340px;}
  textarea{width:100%; min-height:64px; resize:vertical;}
  button.act{
    background:#fff; color:#000; border:1px solid #000; padding:6px 16px;
    font-family:inherit; font-size:13px; cursor:pointer;
  }
  button.act:hover{background:#000;color:#fff;}
  button.act.danger{border-color:#a11;color:#a11;}
  button.act.danger:hover{background:#a11;color:#fff;}
  button.act[disabled]{border-color:var(--line); color:#999; cursor:default; background:#fff;}
  table{border-collapse:collapse; width:100%; margin-top:8px;}
  th,td{border:1px solid var(--line2); padding:4px 7px; text-align:left; vertical-align:top;}
  th{background:var(--soft); font-size:12.5px; white-space:nowrap;}
  td.num{text-align:right; font-family:Consolas,monospace;}
  .tag{display:inline-block; border:1px solid; padding:0 5px; font-size:11.5px; margin-right:4px;}
  .t-comp{color:var(--comp); border-color:var(--comp);}
  .t-proc{color:var(--proc); border-color:var(--proc);}
  .t-prop{color:var(--prop); border-color:var(--prop);}
  .t-meta{color:var(--meta); border-color:var(--meta);}
  .ok{color:#1a6b3c;} .bad{color:#a11;}
  .note{font-size:12.5px; color:#000; background:var(--soft); border-left:3px solid var(--line); padding:7px 9px; margin:8px 0;}
  pre.out{border:1px solid var(--line2); padding:8px; background:#fff; white-space:pre-wrap; max-height:420px; overflow:auto;}
  .scroll{max-height:460px; overflow:auto; border:1px solid var(--line2);}
  .kv{border-collapse:collapse;} .kv td{border:none; padding:1px 8px 1px 0;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .spin{font-size:12.5px;}
</style>
</head>
<body>
<header>
  <h1>MaterialRAG</h1>
  <div class="sub">面向材料文献的检索增强问答与「成分-工艺-组织-性能」结构化抽取 · 文献与推理默认全部在本机完成</div>
</header>

<nav>
  <button class="on" data-tab="status">状态</button>
  <button data-tab="ask">文献问答</button>
  <button data-tab="fill">抽取填表</button>
</nav>

<main>
  <!-- ============ 状态 ============ -->
  <section id="tab-status" class="on">
    <h2>运行环境</h2>
    <div class="row"><button class="act" onclick="refreshStatus()">刷新状态</button></div>
    <div id="status-box"><span class="spin">读取中…</span></div>

    <h2>建立索引</h2>
    <fieldset>
      <legend>把 PDF 解析、切块、向量化</legend>
      <div class="row">
        <label>PDF 通配路径</label>
        <input type="text" id="ingest-glob" placeholder="留空 = 使用 data/raw_pdfs/*.pdf">
      </div>
      <div class="row">
        <label><input type="checkbox" id="ingest-force"> 强制重新解析已索引文献</label>
      </div>
      <button class="act" id="btn-ingest" onclick="doIngest()">开始索引</button>
    </fieldset>
    <div id="ingest-out"></div>
  </section>

  <!-- ============ 问答 ============ -->
  <section id="tab-ask">
    <h2>提问</h2>
    <textarea id="q" placeholder="例如：6061 铝合金的固溶与时效工艺参数分别是多少？"></textarea>
    <div class="row" style="margin-top:8px;">
      <label>召回条数</label>
      <input type="text" id="ask-topk" value="8" style="min-width:70px;width:70px;">
      <button class="act" id="btn-ask" onclick="doAsk()">提问</button>
    </div>
    <div id="ask-out"></div>
  </section>

  <!-- ============ 抽取 ============ -->
  <section id="tab-fill">
    <h2>抽取数据</h2>
    <div class="note">抽取结果会直接显示在下方，<b>不会修改任何文件</b>。只有当你决定写入 Excel 时，才需要指定目标表格路径。</div>
    <div class="row">
      <label>抽取范围</label>
      <select id="mode">
        <option value="auto">auto：表格 + 含数据线索的段落</option>
        <option value="table">table：只抽表格</option>
        <option value="all">all：全部段落</option>
      </select>
      <label style="min-width:auto;">最多块数</label>
      <input type="text" id="maxc" value="0" style="min-width:70px;width:70px;">
      <button class="act" id="btn-ex" onclick="doExtract()">开始抽取</button>
    </div>
    <div id="ex-out"></div>

    <div id="result-area" style="display:none;">
      <h2>抽取结果</h2>
      <div id="ex-summary"></div>
      <div class="scroll" id="ex-table"></div>
    </div>

    <div id="write-area" style="display:none;">
      <h2>写入 Excel（可选）</h2>
      <div class="note">填入目标表路径后，程序会把抽取到的字段按<b>表头列名</b>匹配写入；写入前自动备份，写入后逐格 diff。不填则不会生成任何文件。</div>
      <div class="row">
        <label>Excel 路径</label>
        <input type="text" id="xl" placeholder="C:\path\to\铝合金数据库.xlsx">
      </div>
      <div class="row">
        <button class="act" onclick="doWrite(false)">先看 diff（不落盘）</button>
        <button class="act danger" onclick="doWrite(true)">确认写入（自动备份）</button>
      </div>
      <div id="write-out"></div>
    </div>

    <h2>证据明细</h2>
    <div id="ev-out" class="note">抽取后在此逐字段列出原文引文与页码，用于人工复核。</div>
  </section>
</main>

<script>
let LAST = {rows: [], records: [], excel: ""};

document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('tab-'+b.dataset.tab).classList.add('on');
  };
});

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function api(url, body){
  const opt = body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {};
  const r = await fetch(url, opt);
  const j = await r.json();
  if(!r.ok || j.ok===false) throw new Error(j.error || ('HTTP '+r.status) + (j.trace?('\n'+j.trace):''));
  return j;
}
function busy(btn, on, text){ btn.disabled = on; if(text) btn.textContent = text; }

async function refreshStatus(){
  const box = document.getElementById('status-box');
  box.innerHTML = '<span class="spin">读取中…</span>';
  try{
    const s = await api('/api/status');
    const i = s.index;
    box.innerHTML = `
      <table class="kv">
        <tr><td>已索引文献</td><td class="mono">${i.docs}</td></tr>
        <tr><td>文本块</td><td class="mono">${i.chunks}（其中表格 ${i.tables}）</td></tr>
        <tr><td>向量维度</td><td class="mono">${i.dim} × ${i.vectors}</td></tr>
        <tr><td>向量后端</td><td class="mono">${esc(s.embedding_backend)}</td></tr>
        <tr><td>文献目录</td><td class="mono">${esc(s.raw_dir)}</td></tr>
        <tr><td>索引目录</td><td class="mono">${esc(s.index_dir)}</td></tr>
      </table>
      <h2>大模型连接</h2>
      <div class="${s.llm.ok?'ok':'bad'}">${s.llm.ok ? '已连通' : '未连通'} · ${esc(s.llm.base_url||'')}</div>
      <div class="mono" style="font-size:12px;margin-top:4px;">${s.llm.ok ? ('可用模型：'+esc((s.llm.models||[]).join('、')) ) : ('错误：'+esc(s.llm.error||''))}</div>`;
  }catch(e){ box.innerHTML = '<div class="bad">'+esc(e.message)+'</div>'; }
}

async function doIngest(){
  const btn = document.getElementById('btn-ingest');
  busy(btn, true, '索引中…');
  document.getElementById('ingest-out').innerHTML = '<span class="spin">解析中，请稍候…</span>';
  try{
    const r = await api('/api/ingest', {glob: document.getElementById('ingest-glob').value.trim()||null,
                                        force: document.getElementById('ingest-force').checked});
    let html = `<div class="note">处理 ${r.files} 篇，跳过 ${r.skipped} 篇，共 ${r.chunks} 块（表格 ${r.tables} 个）</div>`;
    html += '<table><tr><th>文件</th><th>状态</th><th>页数</th><th>块数</th><th>表格</th></tr>';
    (r.details||[]).forEach(d=>{ html += `<tr><td class="mono">${esc(d.file)}</td><td>${esc(d.status)}</td><td class="num">${d.pages??''}</td><td class="num">${d.chunks??''}</td><td class="num">${d.tables??''}</td></tr>`; });
    html += '</table>';
    document.getElementById('ingest-out').innerHTML = html;
    refreshStatus();
  }catch(e){ document.getElementById('ingest-out').innerHTML = '<div class="bad">'+esc(e.message)+'</div>'; }
  busy(btn, false, '开始索引');
}

async function doAsk(){
  const btn = document.getElementById('btn-ask');
  const q = document.getElementById('q').value.trim();
  if(!q){ alert('请输入问题'); return; }
  busy(btn, true, '推理中…');
  document.getElementById('ask-out').innerHTML = '<span class="spin">检索并生成中，CPU 推理可能较慢…</span>';
  try{
    const r = await api('/api/ask', {question:q, top_k: parseInt(document.getElementById('ask-topk').value)||8});
    let html = '<h2>回答</h2><pre class="out">'+esc(r.answer)+'</pre><h2>引用来源</h2>';
    html += '<table><tr><th>#</th><th>文献</th><th>页</th><th>类型</th><th>分数</th><th>片段</th></tr>';
    (r.citations||[]).forEach(c=>{
      html += `<tr><td class="num">${c.no}</td><td class="mono">${esc(c.doc)}</td><td class="num">${c.page}</td><td>${esc(c.kind)}</td><td class="num">${c.score}</td><td>${esc(c.excerpt)}…</td></tr>`;
    });
    html += '</table>';
    document.getElementById('ask-out').innerHTML = html;
  }catch(e){ document.getElementById('ask-out').innerHTML = '<div class="bad">'+esc(e.message)+'</div>'; }
  busy(btn, false, '提问');
}

function groupTag(g){
  const m = {composition:['组成分','t-comp'],process:['工艺','t-proc'],
             properties:['性能','t-prop'],microstructure:['组织','t-prop']};
  const x = m[g] || ['其他','t-meta'];
  return `<span class="tag ${x[1]}">${x[0]}</span>`;
}

async function doExtract(){
  const btn = document.getElementById('btn-ex');
  busy(btn, true, '抽取中…');
  document.getElementById('ex-out').innerHTML = '<span class="spin">逐块调用模型抽取中，请稍候…</span>';
  try{
    const r = await api('/api/extract', {mode:document.getElementById('mode').value,
                                         max_chunks:parseInt(document.getElementById('maxc').value)||0});
    LAST = {rows:r.rows, records:r.records, excel:""};
    const heads = r.headers||[];
    document.getElementById('ex-out').innerHTML =
      `<div class="note">候选块 ${r.picked_chunks} 个 · 抽取记录 <b>${r.records_count}</b> 条 · 可显示行 ${r.rows.length} 行</div>`;

    let t = '<table><tr>' + heads.map(h=>`<th>${esc(h)}</th>`).join('') + '</tr>';
    r.rows.forEach(row=>{ t += '<tr>' + heads.map(h=>`<td class="num">${esc(row[h])}</td>`).join('') + '</tr>'; });
    t += '</table>';
    document.getElementById('ex-table').innerHTML = t;
    document.getElementById('ex-summary').innerHTML =
      `<div class="note">共 ${r.rows.length} 行。空白单元格代表原文未提及，或未通过原文核验；程序不会用推测值填补。</div>`;
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('write-area').style.display = 'block';

    const ev = r.evidence||[];
    let e = '<table><tr><th>记录</th><th>文献</th><th>页</th><th>列</th><th>值</th><th>单位</th><th>原文引文</th><th>核验</th></tr>';
    ev.slice(0,400).forEach(x=>{
      e += `<tr><td class="mono">${esc(x.record_id)}</td><td class="mono">${esc(x['来源文献'])}</td>
            <td class="num">${esc(x['页码'])}</td><td>${esc(x['列'])}</td><td class="num">${esc(x['值'])}</td>
            <td>${esc(x['单位'])}</td><td>${esc(x['引文'])}</td>
            <td class="${x['已核验']==='是'?'ok':'bad'}">${esc(x['已核验'])}</td></tr>`;
    });
    e += '</table>';
    if(ev.length>400) e += `<div class="note">仅显示前 400 条，共 ${ev.length} 条。完整明细见输出目录的 evidence.csv。</div>`;
    document.getElementById('ev-out').innerHTML = e;
  }catch(e){ document.getElementById('ex-out').innerHTML = '<div class="bad">'+esc(e.message)+'</div>'; }
  busy(btn, false, '开始抽取');
}

async function doWrite(confirm){
  const out = document.getElementById('write-out');
  if(!LAST.records.length){ alert('请先运行抽取'); return; }
  const xl = document.getElementById('xl').value.trim();
  if(!xl){ alert('请先填写目标 Excel 路径（只有在需要写入表格时才需要它）'); return; }
  LAST.excel = xl;
  if(confirm && !window.confirm('将向以下表格追加数据：\n' + xl + '\n\n写入前会自动备份原文件，未通过原文核验的字段不会写入。确认继续？')) return;
  out.innerHTML = '<span class="spin">处理中…</span>';
  try{
    const r = await api('/api/fill', {excel_path:LAST.excel, records:LAST.records, confirm:confirm});
    if(r.dry_run){
      out.innerHTML = `<div class="note">${esc(r.note)}</div>`;
    }else{
      out.innerHTML = `<div class="note">
        已写入 ${r.appended_rows} 行 / ${r.written_cells} 个单元格。<br>
        备份文件：<span class="mono">${esc(r.backup)}</span><br>
        非预期变更：<b class="${r.unexpected_count?'bad':'ok'}">${r.unexpected_count}</b>
        ${r.unexpected_count? '（存在非预期变更，请立即检查原表）':'（原表其余内容未受影响）'}
      </div><pre class="out">${esc(r.report_text||'')}</pre>`;
    }
  }catch(e){ out.innerHTML = '<div class="bad">'+esc(e.message)+'</div>'; }
}

refreshStatus();
</script>
</body>
</html>
